#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "reticulum"
name = "Reticulum"
description.en = "Explain in *a few (10~15) words* the purpose of the app or what it actually does (it is meant to give a rough idea to users browsing a catalog of 100+ apps)"
description.fr = "Expliquez en *quelques* (10~15) mots l'utilité de l'app ou ce qu'elle fait (l'objectif est de donner une idée grossière pour des utilisateurs qui naviguent dans un catalogue de 100+ apps)"

version = "1.0~ynh1"

maintainers = []

[upstream]
license = "Non-free" # you can see the available licenses identifiers list here: https://spdx.org/licenses/
website = "https://example.com"
demo = "https://demo.example.com"
admindoc = "https://doc.yunohost.org/dev/packaging/"
userdoc = "https://yunohost.org/apps"
code = "https://github.com/markqvist/reticulum"


[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = "amd64"
multi_instance = false

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.enable_transport]
    ask.en = "use as server"
    type = "boolean"
    default = false
    
    [install.backbone_listen_enabled]
    ask.en = "Use as backbone listener"
    type = "boolean"
    optional = true

    [install.backbone_listen_on]
    ask.en = "Listen on"
    type = "string"
    optional = true
    
    [install.backbone_remote_enabled]
    ask.en = "Use as backbone client"
    type = "boolean"
    optional = true
    
    [install.backbone_remote_target]
    ask.en = "Remote target"
    type = "string"
    optional = true
        
    [install.tcp_server_enabled]
    ask.en = "Use as TCP server"
    type = "boolean"
    optional = true

    [install.tcp_listen_on]
    ask.en = "Listen on"
    type = "string"
    optional = true

    [install.tcp_client_enabled]
    ask.en = "Use as TCP client"
    type = "boolean"
    optional = true

    [install.tcp_client_target_host]
    ask.en = "Target host"
    type = "string"
    optional = true
        
[resources]
    [resources.system_user]

    [resources.install_dir]
    
    [resources.ports]
    main.default = 4242
    
    [resources.apt]
    packages = "build-essential python3-venv"
